<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liftoff — Ranked Gym Workouts &amp; Strength Bodyrank</title>
  <meta name="description" content="Log gym sets, calculate Epley 1RM scaled by bodyweight, and rank every lift &amp; muscle group across 9 tiers from Wood to Olympian.">
  <meta name="theme-color" content="#0D0E1B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liftoff">
  <style>
:root {
  /* Core Liftoff Midnight Surfaces */
  --bg-outer: #06070F;
  --bg-app: #0D0E1B;
  --bg-elevated: #15182B;
  --bg-card: #181C32;
  --bg-card-hover: #1E233D;
  --bg-input: #0F1222;
  --bg-nav: #0F1120;
  --bg-nav-active: #1C2642;

  /* Borders & Hairlines */
  --border-subtle: #232846;
  --border-strong: #333B63;
  --border-hero-glow: #58C7FF;

  /* Text Hierarchy (APCA-calibrated on dark #0D0E1B - #181C32) */
  --text-primary: #F8FAFC;
  --text-secondary: #CBD5E1;
  --text-muted: #94A3B8;

  /* Brand & Action Accents */
  --accent-blue: #3898FF;
  --accent-blue-strong: #1D6FE8;
  --accent-quest-bg: #175B35;
  --accent-quest-btn: #15803D;
  --accent-blue-card: #15457A;
  --accent-crimson-start: #751822;
  --accent-crimson-end: #931F2D;
  --accent-crimson-border: #AD2E3D;
  --accent-success: #16A34A;
  --accent-warn: #F59E0B;
  --accent-danger: #E11D48;

  /* Radii & Spacing (Concentric R_out = R_in + P) */
  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --radius-pill: 999px;

  --dock-height: 66px;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-outer);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

.tabular,
input,
select,
.timer-pill,
.rank-chip,
.stat-value {
  font-variant-numeric: tabular-nums;
}

button,
input,
select,
textarea {
  font-family: inherit;
  font-size: 16px;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 2px;
}

/* Mobile-first App Frame (375x812 native feel, centered phone shell on desktop) */
.app-shell {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  margin: 0 auto;
  background-color: var(--bg-app);
  position: relative;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(var(--dock-height) + 26px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 24px 64px rgba(0, 0, 0, 0.65);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Top Status Header (Lv.1 + XP bar, Streak, Gems, VI/EN, Bell) */
.top-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 8px;
  background: var(--bg-app);
  position: sticky;
  top: 0;
  z-index: 20;
}

.level-cluster {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  min-height: 44px;
  padding: 2px 4px 2px 0;
}

.avatar-wrap {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.level-track-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.level-label {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.1;
  text-align: left;
}

.xp-bar-outer {
  width: 78px;
  height: 10px;
  border-radius: var(--radius-pill);
  border: 1.5px solid #4DA8FF;
  background: #0A1020;
  padding: 1.5px;
  display: flex;
  align-items: center;
}

.xp-bar-inner {
  height: 100%;
  min-width: 6px;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, #38BDF8 0%, #818CF8 100%);
  transition: width 220ms ease-out;
}

.header-counters {
  display: flex;
  align-items: center;
  gap: 6px;
}

.counter-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  padding: 6px 6px;
  min-height: 44px;
}

.lang-toggle-btn,
.icon-action-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--text-primary);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
}

.lang-toggle-btn {
  padding: 0 9px;
  letter-spacing: 0.02em;
}

/* Home Sub-Tabs (For You | Friends | Discovery) */
.subtabs-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 8px;
}

.subtab-btn {
  min-height: 44px;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-muted);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.subtab-btn.is-active {
  color: #55A6FF;
}

.subtab-btn.is-active::after {
  content: "";
  position: absolute;
  left: 14%;
  right: 14%;
  bottom: -1px;
  height: 2.5px;
  border-radius: 2px;
  background: #4299FF;
}

/* Main View Container */
.main-content {
  padding: 16px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  flex: 1;
}

/* Active Workout Floating Banner when navigating other tabs */
.active-workout-banner {
  background: linear-gradient(90deg, #1D4ED8 0%, #2563EB 100%);
  border: 1px solid #60A5FA;
  border-radius: var(--radius-md);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.active-workout-banner-btn {
  background: #FFFFFF;
  color: #0F172A;
  font-weight: 800;
  font-size: 13.5px;
  padding: 8px 14px;
  min-height: 44px;
  border-radius: var(--radius-pill);
}

/* Hero Bodyrank Card (IMG_1551.png exact layout) */
.bodyrank-hero-card {
  position: relative;
  width: 100%;
  text-align: left;
  border-radius: var(--radius-xl);
  padding: 16px 14px 16px 16px;
  background: radial-gradient(120% 120% at 80% 20%, #231D47 0%, #14162B 58%, #101223 100%);
  border: 1.6px solid var(--border-hero-glow);
  box-shadow: 0 0 20px rgba(88, 199, 255, 0.16), inset 0 0 18px rgba(139, 92, 246, 0.14);
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
  min-height: 144px;
}

.bodyrank-hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.bodyrank-copy {
  max-width: 60%;
  z-index: 2;
}

.bodyrank-eyebrow {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
  margin: 0 0 3px;
}

.bodyrank-headline {
  font-size: 16.5px;
  font-weight: 800;
  line-height: 1.26;
  color: #FFFFFF;
  margin: 0;
}

.bodyrank-art-wrap {
  position: absolute;
  right: 6px;
  top: 6px;
  bottom: 6px;
  width: 142px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  pointer-events: none;
}

.bodyrank-badge-float {
  position: absolute;
  right: 8px;
  bottom: 4px;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.55));
}

.bodyrank-progress-track {
  position: relative;
  z-index: 2;
  width: calc(100% - 58px);
  height: 14px;
  background: #2A2D45;
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.bodyrank-progress-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, #5CE1E6 0%, #8474FF 52%, #B55CFF 100%);
  transition: width 260ms ease-out;
}

/* Section Headers */
.section-block {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.section-heading-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.section-title {
  font-size: 18.5px;
  font-weight: 800;
  letter-spacing: -0.01em;
  margin: 0;
  color: #FFFFFF;
}

/* Getting Started Horizontal Quest Carousel */
.quest-carousel {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}

.quest-carousel::-webkit-scrollbar {
  display: none;
}

.quest-card {
  flex: 0 0 256px;
  max-width: 82%;
  scroll-snap-align: start;
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
  min-height: 156px;
}

.quest-card.is-green {
  background: var(--accent-quest-bg);
  border: 1px solid rgba(74, 222, 128, 0.24);
}

.quest-card.is-blue {
  background: var(--accent-blue-card);
  border: 1px solid rgba(96, 165, 250, 0.26);
}

.quest-card-title {
  font-size: 15.5px;
  font-weight: 800;
  margin: 0 0 5px;
  color: #FFFFFF;
}

.quest-card-desc {
  font-size: 13.5px;
  line-height: 1.38;
  color: #E2E8F0;
  margin: 0;
}

.quest-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.quest-ring-wrap {
  position: relative;
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  color: #FFFFFF;
}

.quest-cta-btn {
  min-height: 44px;
  padding: 0 18px;
  border-radius: var(--radius-pill);
  font-size: 14.5px;
  font-weight: 800;
  color: #FFFFFF;
  background: var(--accent-quest-btn);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.quest-card.is-blue .quest-cta-btn {
  background: #1D6FE8;
}

/* Rank Your Workout Crimson Card */
.rank-workout-cta-card {
  width: 100%;
  min-height: 76px;
  padding: 10px 16px 10px 12px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--accent-crimson-start) 0%, var(--accent-crimson-end) 100%);
  border: 1px solid var(--accent-crimson-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 8px 22px rgba(147, 31, 45, 0.28);
}

.rank-workout-left {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
}

.rank-workout-label {
  font-size: 16px;
  font-weight: 800;
  color: #FFFFFF;
}

.rank-workout-sub {
  display: block;
  font-size: 12.5px;
  color: #FECDD3;
  font-weight: 600;
  margin-top: 2px;
}

.rank-workout-start {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 15.5px;
  font-weight: 800;
  color: #FFFFFF;
  flex-shrink: 0;
}

/* Recovery Zone Card */
.recovery-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.recovery-item {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.recovery-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 700;
}

.recovery-bar {
  height: 6px;
  background: #0D1020;
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.recovery-bar-fill {
  height: 100%;
  border-radius: var(--radius-pill);
}

/* Active Workout Logger View */
.logger-header-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.logger-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}

.timer-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-pill);
  padding: 6px 10px;
  min-height: 44px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
}

.timer-pill.is-resting {
  border-color: #38BDF8;
  background: rgba(56, 189, 248, 0.14);
  color: #BAE6FD;
}

.post-workout-btn {
  min-height: 44px;
  padding: 0 13px;
  border-radius: var(--radius-pill);
  background: var(--accent-success);
  color: #FFFFFF;
  font-size: 13.5px;
  font-weight: 800;
  white-space: nowrap;
}

.bw-inline-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}

.bw-inline-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.compact-num-input {
  width: 74px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text-primary);
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  padding: 4px 6px;
}

.unit-switch-btn {
  min-width: 48px;
  min-height: 44px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  font-size: 13.5px;
  font-weight: 800;
  color: #93C5FD;
}

/* Exercise Logger Card & Set Table */
.exercise-log-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.exercise-log-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.exercise-log-title {
  font-size: 16px;
  font-weight: 800;
  margin: 0;
  color: #FFFFFF;
}

.exercise-cue {
  font-size: 12.5px;
  color: var(--text-muted);
  margin: 2px 0 0;
}

.next-rank-banner {
  background: rgba(56, 152, 255, 0.11);
  border: 1px solid rgba(56, 152, 255, 0.30);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.set-grid-header,
.set-row {
  display: grid;
  grid-template-columns: 44px minmax(62px, 1fr) minmax(56px, 0.9fr) minmax(68px, 1fr) 44px;
  gap: 6px;
  align-items: center;
}

.set-grid-header {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--text-muted);
  text-align: center;
  padding: 2px 0;
}

.set-row {
  padding: 4px 0;
  border-radius: var(--radius-sm);
}

.set-row.is-completed {
  background: rgba(22, 163, 74, 0.10);
}

.set-type-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  font-size: 13.5px;
  font-weight: 800;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.set-type-btn.is-warmup {
  color: #FBBF24;
  border-color: rgba(251, 191, 36, 0.4);
}

.set-type-btn.is-dropset {
  color: #C084FC;
  border-color: rgba(192, 132, 252, 0.4);
}

.set-input {
  width: 100%;
  height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: #FFFFFF;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  padding: 0 4px;
}

.live-rank-pill {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 2px 4px;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  font-size: 11.5px;
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
}

.set-check-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  font-size: 16px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}

.set-check-btn.is-checked {
  background: var(--accent-success);
  border-color: #4ADE80;
  color: #FFFFFF;
}

.exercise-card-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 4px;
}

.secondary-btn {
  min-height: 44px;
  padding: 0 14px;
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
}

.danger-text-btn {
  min-height: 44px;
  padding: 0 12px;
  border-radius: var(--radius-md);
  color: #FDA4AF;
  background: rgba(225, 29, 72, 0.12);
  border: 1px solid rgba(225, 29, 72, 0.3);
  font-size: 13.5px;
  font-weight: 700;
}

/* Ranks & Bodygraph View */
.ranks-stage-card {
  background: radial-gradient(100% 100% at 50% 15%, #1E2243 0%, #13162A 100%);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.segmented-toggle {
  display: inline-flex;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-pill);
  padding: 3px;
  gap: 4px;
}

.segmented-btn {
  min-height: 44px;
  padding: 0 12px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  white-space: nowrap;
}

.segmented-btn.is-active {
  background: var(--accent-blue-strong);
  color: #FFFFFF;
}

.bodygraph-stage-wrap {
  width: 100%;
  max-width: 230px;
  display: flex;
  justify-content: center;
}

.bodygraph-interactive-svg {
  width: 100%;
  height: auto;
  max-height: 300px;
}

.muscle-region {
  cursor: pointer;
  transition: opacity 150ms ease, filter 150ms ease;
}

.muscle-Detail-strip {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.muscle-grid-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.muscle-row-card {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
  min-height: 58px;
}

.muscle-row-card.is-selected {
  border-color: var(--accent-blue);
  background: #1C2340;
}

/* Calculator & Ladder Cards */
.calc-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.calc-select,
.search-input {
  width: 100%;
  min-height: 46px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: #FFFFFF;
  padding: 0 12px;
  font-size: 16px;
}

.calc-inputs-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  align-items: center;
}

.tier-ladder-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.tier-ladder-cell {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}

/* Bottom 6-Tab Navigation Dock (Exact IMG_1551.png match) */
.bottom-dock {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 430px;
  background: var(--bg-nav);
  border-top: 1px solid var(--border-subtle);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 2px;
  z-index: 30;
}

.dock-tab-btn {
  min-height: 56px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 2px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
}

.dock-tab-btn.is-active {
  background: var(--bg-nav-active);
  color: #FFFFFF;
  font-weight: 700;
}

/* Modal / Drawer Overlay (<dialog> safe on Safari iOS) */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 14, 0.82);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal-backdrop[hidden] {
  display: none;
}

.modal-sheet {
  width: 100%;
  max-width: 430px;
  max-height: 90dvh;
  background: var(--bg-app);
  border-top: 1px solid var(--border-strong);
  border-radius: 22px 22px 0 0;
  padding: 16px 14px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}

.filter-chips-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.filter-chips-row::-webkit-scrollbar {
  display: none;
}

.filter-chip {
  flex-shrink: 0;
  min-height: 44px;
  padding: 0 14px;
  border-radius: var(--radius-pill);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 700;
}

.filter-chip.is-active {
  background: var(--accent-blue-strong);
  border-color: #60A5FA;
  color: #FFFFFF;
}

.picker-exercise-btn {
  width: 100%;
  min-height: 60px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
}

.picker-exercise-btn.is-picked {
  border-color: #38BDF8;
  background: rgba(56, 189, 248, 0.12);
}

/* Celebration Rank-Up Modal */
.celebration-hero {
  background: radial-gradient(100% 100% at 50% 0%, #2B1F52 0%, #14172B 100%);
  border: 1.5px solid #60A5FA;
  border-radius: var(--radius-xl);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
}

.pr-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 800;
  background: rgba(250, 204, 21, 0.18);
  color: #FDE047;
  border: 1px solid rgba(250, 204, 21, 0.4);
}

@media (hover: hover) and (pointer: fine) {
  .bodyrank-hero-card:hover,
  .rank-workout-cta-card:hover,
  .muscle-row-card:hover,
  .picker-exercise-btn:hover {
    filter: brightness(1.06);
  }
}

@media (max-width: 359px) {
  .xp-bar-outer {
    width: 56px;
  }
  .dock-tab-btn {
    font-size: 10px;
  }
  .set-grid-header,
  .set-row {
    grid-template-columns: 40px minmax(52px, 1fr) minmax(48px, 0.9fr) minmax(58px, 1fr) 40px;
    gap: 4px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  function buildNextRankHintHtml(ex, currentBestRating, sampleReps, bwKg, sex, unit) {
    const tierInfo = core.ratingToTierAndLp(currentBestRating);
    if (!tierInfo.nextTier) {
      return '<span>' + escapeHtml(tr('maxTierReached')) + '</span><span style="color:#FDE047;font-weight:800;">900+ LP</span>';
    }
    const targetFloor = tierInfo.nextTier.index === 1 ? 200 : tierInfo.nextTier.min;
    const nextTierObj = tierInfo.nextTier.index === 1 ? core.RANK_TIERS[2] : tierInfo.nextTier;
    const solved = core.solveWeightForRating(ex, targetFloor, sampleReps || 8, bwKg, sex, unit);
    if (!solved) return '';
    const loadLabel = ex.isBodyweight && solved.weightInUnit === 0
      ? ('BW × ' + String(solved.reps))
      : (String(solved.weightInUnit) + '\u00A0' + unit + ' × ' + String(solved.reps));
    return (
      '<span>' + escapeHtml(tr('nextRankTargetPrefix')) + ' <strong style="color:' + nextTierObj.color + ';">' +
      escapeHtml(tierName(nextTierObj)) + '</strong>:</span>' +
      '<strong class="tabular" style="color:#F8FAFC;">' + escapeHtml(loadLabel) + '</strong>'
    );
  }

    const snap = core.computeDerivedRankSnapshot(appState.profile, appState.workouts, now);
    renderHeader(snap);

    const viewHost = document.getElementById('app-view-host');
    if (viewHost) {
      let activeBanner = '';
      if (appState.activeSession && ui.activeTab !== 'workout') {
        activeBanner =
          '<div style="padding:10px 14px 0;">' +
          '<div class="active-workout-banner">' +
          '<span style="font-size:13.5px;font-weight:700;">&#128170; ' + escapeHtml(tr('resumeWorkout')) + ' (' + String(appState.activeSession.entries.length) + ')</span>' +
          '<button type="button" class="active-workout-banner-btn" data-action="go-tab" data-tab="workout">' + escapeHtml(tr('continueBtn')) + '</button>' +
          '</div></div>';
      }

      let bodyHtml = '';
      if (ui.activeTab === 'workout') bodyHtml = renderWorkoutTab(snap);
      else if (ui.activeTab === 'ranks') bodyHtml = renderRanksTab(snap);
      else if (ui.activeTab === 'nutrition') bodyHtml = renderNutritionTab();
      else if (ui.activeTab === 'friends') bodyHtml = '<main class="main-content">' + renderFriendsLeaderboardInner(snap) + '</main>';
      else if (ui.activeTab === 'profile') bodyHtml = renderProfileTab(snap);
      else bodyHtml = renderHomeView(snap);

      viewHost.innerHTML = activeBanner + bodyHtml;
    }

    renderBottomDock();
    renderPickerModal(snap);
    renderCelebrationModal();
    renderToast();
  }

  // Surgical live update while typing weight/reps so iOS Safari numeric keyboard NEVER loses focus!
  function handleLiveSetInput(target) {
    const field = target.getAttribute('data-set-input');
    const exId = target.getAttribute('data-ex');
    const setId = target.getAttribute('data-set');
    if (!field || !exId || !setId || !appState.activeSession) return;

    const numVal = storage.parseDecimalInput(target.value);
    if (!Number.isFinite(numVal) || numVal < 0) return;

    const unit = appState.profile.unit;
    const action = { type: 'UPDATE_SET', exerciseId: exId, setId: setId };
    if (field === 'weight') {
      action.weightKg = core.unitToKg(numVal, unit);
    } else {
      action.reps = Math.floor(numVal);
    }

    appState = core.reduceAppState(appState, action, Date.now()).state;
    storage.saveState(appState);

    // Update only the live rank pill & next-rank target banner in place
    const ex = catalog.EXERCISE_BY_ID[exId];
    let entryObj = null;
    for (let i = 0; i < appState.activeSession.entries.length; i += 1) {
      if (appState.activeSession.entries[i].exerciseId === exId) {
        entryObj = appState.activeSession.entries[i];
        break;
      }
    }
    if (!entryObj || !ex) return;

    let setObj = null;
    let bestRating = 0;
    let refReps = 8;
    const snap = core.computeDerivedRankSnapshot(appState.profile, appState.workouts, Date.now());
    if (snap.exerciseStats[exId]) bestRating = snap.exerciseStats[exId].bestRating;

    for (let i = 0; i < entryObj.sets.length; i += 1) {
      const s = entryObj.sets[i];
      if (s.id === setId) setObj = s;
      if (s.reps >= 1) refReps = s.reps;
      const ev = core.evaluateSetStrength(s, ex, appState.profile.bodyweightKg, appState.profile.sex);
      if (ev.valid && ev.rating > bestRating) bestRating = ev.rating;
    }

    const pillEl = document.getElementById('rank-pill-' + setId);
    if (pillEl && setObj) {
      pillEl.innerHTML = renderSetRankBadgeInner(setObj, ex);
    }
    const bannerEl = document.getElementById('next-banner-' + exId);
    if (bannerEl) {
      bannerEl.innerHTML = buildNextRankHintHtml(ex, bestRating, refReps, appState.profile.bodyweightKg, appState.profile.sex, unit);
    }
  }

  function bindGlobalEvents() {
    document.addEventListener('click', function (ev) {
      // Check interactive SVG muscle region click first
      const musclePath = ev.target.closest ? ev.target.closest('.muscle-region') : null;
      if (musclePath) {
        const mId = musclePath.getAttribute('data-muscle');
        if (mId) {
          ui.selectedMuscleId = mId;
          renderAll();
          return;
        }
      }

      const btn = ev.target.closest ? ev.target.closest('[data-action]') : null;
      if (!btn) return;
      const act = btn.getAttribute('data-action');

      switch (act) {
        case 'toggle-lang':
          dispatch({ type: 'SET_LANG', lang: appState.lang === 'vi' ? 'en' : 'vi' });
          break;

        case 'toggle-sound':
          dispatch({ type: 'TOGGLE_SOUND' });
          break;

        case 'go-tab': {
          const targetTab = btn.getAttribute('data-tab') || 'home';
          ui.activeTab = targetTab;
          renderAll();
          window.scrollTo(0, 0);
          break;
        }

        case 'set-home-subtab':
          ui.homeSubtab = btn.getAttribute('data-subtab') || 'foryou';
          renderAll();
          break;

        case 'open-picker':
          ui.pickerAddingToActive = false;
          ui.pickerOpen = true;
          renderAll();
          break;

        case 'open-picker-add':
          ui.pickerAddingToActive = true;
          ui.pickerSelectedIds = [];
          ui.pickerOpen = true;
          renderAll();
          break;

        case 'close-picker':
          ui.pickerOpen = false;
          renderAll();
          break;

        case 'picker-cat':
          ui.pickerCategory = btn.getAttribute('data-cat') || 'all';
          renderPickerModal(core.computeDerivedRankSnapshot(appState.profile, appState.workouts, Date.now()));
          break;

        case 'toggle-pick-ex': {
          const exId = btn.getAttribute('data-ex');
          const idx = ui.pickerSelectedIds.indexOf(exId);
          if (idx === -1) ui.pickerSelectedIds.push(exId);
          else ui.pickerSelectedIds.splice(idx, 1);
          renderPickerModal(core.computeDerivedRankSnapshot(appState.profile, appState.workouts, Date.now()));
          break;
        }

        case 'confirm-picker': {
          if (ui.pickerSelectedIds.length === 0) {
            ui.pickerSelectedIds = ['bench_press'];
          }
          ui.pickerOpen = false;
          if (ui.pickerAddingToActive && appState.activeSession) {
            dispatch({ type: 'ADD_EXERCISES_TO_SESSION', exerciseIds: ui.pickerSelectedIds.slice() });
          } else {
            ui.activeTab = 'workout';
            dispatch({ type: 'START_WORKOUT', exerciseIds: ui.pickerSelectedIds.slice() });
          }
          break;
        }

        case 'start-preset': {
          const pId = btn.getAttribute('data-preset');
          const preset = catalog.WORKOUT_PRESETS.find(function (p) { return p.id === pId; });
          if (preset) {
            ui.activeTab = 'workout';
            dispatch({
              type: 'START_WORKOUT',
              title: appState.lang === 'vi' ? preset.nameVi : preset.nameEn,
              exerciseIds: preset.exerciseIds
            });
          }
          break;
        }

        case 'toggle-unit': {
          const nextUnit = appState.profile.unit === 'kg' ? 'lbs' : 'kg';
          dispatch({ type: 'UPDATE_PROFILE', unit: nextUnit });
          break;
        }

        case 'cycle-set-type': {
          const exId = btn.getAttribute('data-ex');
          const setId = btn.getAttribute('data-set');
          if (!appState.activeSession) break;
          const entry = appState.activeSession.entries.find(function (e) { return e.exerciseId === exId; });
          const s = entry && entry.sets.find(function (x) { return x.id === setId; });
          if (s) {
            const order = ['working', 'warmup', 'dropset'];
            const nextType = order[(order.indexOf(s.setType || 'working') + 1) % order.length];
            dispatch({ type: 'UPDATE_SET', exerciseId: exId, setId: setId, setType: nextType });
          }
          break;
        }

        case 'toggle-set-done': {
          const exId = btn.getAttribute('data-ex');
          const setId = btn.getAttribute('data-set');
          if (!appState.activeSession) break;
          const entry = appState.activeSession.entries.find(function (e) { return e.exerciseId === exId; });
          const s = entry && entry.sets.find(function (x) { return x.id === setId; });
          if (s) {
            const nextDone = !s.completed;
            if (nextDone) {
              sound.playSetCheck(appState.soundEnabled);
              ui.restEndAtMs = Date.now() + appState.profile.restTimerSec * 1000;
            }
            dispatch({ type: 'UPDATE_SET', exerciseId: exId, setId: setId, completed: nextDone });
          }
          break;
        }

        case 'add-set':
          dispatch({ type: 'ADD_SET', exerciseId: btn.getAttribute('data-ex') });
          break;

        case 'delete-last-set': {
          const exId = btn.getAttribute('data-ex');
          if (!appState.activeSession) break;
          const entry = appState.activeSession.entries.find(function (e) { return e.exerciseId === exId; });
          if (entry && entry.sets.length > 1) {
            const lastSet = entry.sets[entry.sets.length - 1];
            dispatch({ type: 'DELETE_SET', exerciseId: exId, setId: lastSet.id });
          }
          break;
        }

        case 'remove-ex-session':
          dispatch({ type: 'REMOVE_EXERCISE_FROM_SESSION', exerciseId: btn.getAttribute('data-ex') });
          break;

        case 'start-or-skip-rest':
          if (ui.restEndAtMs > Date.now()) {
            ui.restEndAtMs = 0;
          } else {
            ui.restEndAtMs = Date.now() + appState.profile.restTimerSec * 1000;
          }
          syncTicker();
          renderAll();
          break;

        case 'post-workout':
          dispatch({ type: 'POST_WORKOUT' });
          break;

        case 'cancel-workout':
          ui.restEndAtMs = 0;
          dispatch({ type: 'CANCEL_WORKOUT' });
          break;

        case 'close-celebration':
          ui.celebrationData = null;
          ui.activeTab = 'ranks';
          renderAll();
          window.scrollTo(0, 0);
          break;

        case 'set-bodygraph-view':
          ui.ranksViewMode = btn.getAttribute('data-view') === 'back' ? 'back' : 'front';
          renderAll();
          break;

        case 'select-muscle':
          ui.selectedMuscleId = btn.getAttribute('data-muscle') || 'lower_chest';
          ui.ranksViewMode = btn.getAttribute('data-view') === 'back' ? 'back' : 'front';
          renderAll();
          break;

        case 'train-muscle': {
          const grp = btn.getAttribute('data-group') || 'all';
          ui.pickerCategory = grp;
          const matching = catalog.EXERCISES
            .filter(function (ex) { return ex.primaryMuscles.indexOf(ui.selectedMuscleId) !== -1; })
            .slice(0, 2)
            .map(function (ex) { return ex.id; });
          if (matching.length > 0) ui.pickerSelectedIds = matching;
          ui.pickerAddingToActive = Boolean(appState.activeSession);
          ui.pickerOpen = true;
          renderAll();
          break;
        }

        case 'run-calc': {
          const selEl = document.getElementById('calc-ex-select');
          const wEl = document.getElementById('calc-weight-input');
          const rEl = document.getElementById('calc-reps-input');
          if (selEl) ui.calcExerciseId = selEl.value;
          if (wEl) ui.calcWeightText = wEl.value;
          if (rEl) ui.calcRepsText = rEl.value;
          renderAll();
          break;
        }

        case 'quick-meal':
          dispatch({
            type: 'ADD_MEAL',
            name: btn.getAttribute('data-name'),
            kcal: Number(btn.getAttribute('data-kcal')),
            proteinG: Number(btn.getAttribute('data-pro'))
          });
          break;

        case 'delete-meal':
          dispatch({ type: 'DELETE_MEAL', mealId: btn.getAttribute('data-meal') });
          break;

        case 'set-sex':
          dispatch({ type: 'UPDATE_PROFILE', sex: btn.getAttribute('data-sex') });
          break;

        case 'save-profile': {
          const bwInput = document.getElementById('prof-bw-input');
          const restInput = document.getElementById('prof-rest-input');
          const bwVal = bwInput ? storage.parseDecimalInput(bwInput.value) : NaN;
          const restVal = restInput ? storage.parseDecimalInput(restInput.value) : NaN;
          dispatch({
            type: 'UPDATE_PROFILE',
            bodyweightKg: Number.isFinite(bwVal) ? core.unitToKg(bwVal, appState.profile.unit) : appState.profile.bodyweightKg,
            restTimerSec: Number.isFinite(restVal) ? restVal : appState.profile.restTimerSec
          });
          showToast(appState.lang === 'vi' ? 'Đã cập nhật chuẩn cân nặng!' : 'Bodyweight standard saved!');
          break;
        }

        case 'delete-workout':
          dispatch({ type: 'DELETE_WORKOUT', workoutId: btn.getAttribute('data-wk') });
          break;

        case 'load-demo':
          dispatch({ type: 'LOAD_DEMO_DATA' });
          showToast(appState.lang === 'vi' ? 'Đã nạp dữ liệu mẫu lên Rank!' : 'Loaded sample ranked workouts!');
          break;

        case 'reset-all':
          dispatch({ type: 'RESET_ALL' });
          break;

        case 'export-json': {
          const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'liftoff-ranks-backup.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          break;
        }

        default:
          break;
      }
    });

    document.addEventListener('input', function (ev) {
      const t = ev.target;
      if (!t || !t.getAttribute) return;

      if (t.getAttribute('data-set-input')) {
        handleLiveSetInput(t);
        return;
      }

      if (t.id === 'logger-bw-input') {
        const v = storage.parseDecimalInput(t.value);
        if (Number.isFinite(v) && v >= 25 && v <= 550) {
          appState = core.reduceAppState(
            appState,
            { type: 'UPDATE_PROFILE', bodyweightKg: core.unitToKg(v, appState.profile.unit) },
            Date.now()
          ).state;
          storage.saveState(appState);
        }
        return;
      }

      if (t.id === 'picker-search-input') {
        ui.pickerSearch = t.value;
        const pos = t.selectionStart;
        renderPickerModal(core.computeDerivedRankSnapshot(appState.profile, appState.workouts, Date.now()));
        const nextInput = document.getElementById('picker-search-input');
        if (nextInput) {
          nextInput.focus();
          try {
            nextInput.setSelectionRange(pos, pos);
          } catch (_e) {}
        }
        return;
      }

      if (t.id === 'calc-weight-input') ui.calcWeightText = t.value;
      if (t.id === 'calc-reps-input') ui.calcRepsText = t.value;
    });

    document.addEventListener('change', function (ev) {
      const t = ev.target;
      if (t && t.id === 'calc-ex-select') {
        ui.calcExerciseId = t.value;
        renderAll();
      }
    });

    document.addEventListener('visibilitychange', function () {
      syncTicker();
    });
  }

  bindGlobalEvents();
  renderAll();
  syncTicker();
})();

  </script>
